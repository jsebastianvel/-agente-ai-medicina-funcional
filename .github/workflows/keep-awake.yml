name: Keep Streamlit app awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app to prevent Streamlit Cloud from putting it to sleep
        run: curl -sSf --retry 3 --retry-delay 5 -o /dev/null https://functionalmedicineagent.streamlit.app/healthz
